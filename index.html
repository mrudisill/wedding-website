<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="content.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<div id="intro" aria-label="Invitation">
  <div class="env" id="env">
    <div class="env-back"></div>
    <div class="env-card" id="envCard">
      <div class="mono" id="cardMono"></div>
      <p class="label">You're invited</p>
      <div class="who" id="cardWho"></div>
      <p class="label when" id="cardWhen"></p>
      <form id="pwForm" autocomplete="off">
        <input id="pwInput" type="password" placeholder="Password" aria-label="Password">
        <button class="btn" type="submit">Open</button>
        <p class="err" id="pwErr"></p>
      </form>
    </div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <button class="seal" id="seal" aria-label="Open the invitation"></button>
  </div>
  <p class="intro-hint">Tap the seal to open</p>
</div>

<nav class="nav" id="nav">
  <a class="mono" href="#top" id="navMono"></a>
  <ul class="nav-links" id="navLinks"></ul>
  <button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
</nav>
<div class="menu" id="menu"></div>

<main>
  <header class="hero" id="top">
    <canvas class="petals" id="petals"></canvas>
    <div>
      <div class="hero-mono" id="heroMono"></div>
      <h1 class="names" id="heroNames"></h1>
      <p class="hero-date rise" style="--d:2.2s" id="heroDate"></p>
      <p class="label rise" style="--d:2.5s" id="heroLine"></p>
      <p class="hero-script rise" style="--d:2.8s" id="heroScript"></p>
      <div class="countdown rise" style="--d:3.1s" id="countdown"></div>
      <div class="hero-photo rise" style="--d:3.3s" id="heroPhoto" hidden></div>
    </div>
    <a class="scroll-cue rise" style="--d:3.4s" href="#welcome" aria-label="Scroll down"></a>
  </header>

  <section class="sec tone-blue" id="welcome"></section>
  <section class="sec tone-ivory" id="schedule"></section>
  <section class="sec tone-blue" id="stay"></section>
  <section class="sec tone-ivory" id="travel"></section>
  <section class="sec tone-blue" id="todo"></section>
  <section class="sec tone-ivory" id="attire"></section>
  <section class="sec tone-blue" id="faq"></section>
  <section class="sec rsvp" id="rsvp"></section>
</main>

<footer>
  <div class="mono" id="footMono"></div>
  <p id="footText"></p>
</footer>

<button class="to-top" id="toTop" aria-label="Back to top"></button>

<script>
(() => {
const S = window.SITE || {};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const FX = { leaves: false, hearts: false, ...(S.effects || {}) };
const mapUrl = q => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };

const ICONS = {
  drinks: '<path d="M5 4h14l-7 8z"/><path d="M12 12v7M8 20h8"/><path d="M15 4l2-2"/>',
  rings: '<circle cx="9" cy="14" r="5"/><circle cx="15" cy="14" r="5"/><path d="M10 5l2-2.5L14 5l-2 2z"/>',
  dinner: '<circle cx="12" cy="13" r="5"/><path d="M3 4v5a1.5 1.5 0 0 0 3 0V4M4.5 9v11"/><path d="M20 4c-1.6 1-2.2 3-2.2 6H20v10"/>',
  party: '<path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  sun: '<circle cx="12" cy="10" r="4"/><path d="M12 2v2M4.9 4.9l1.4 1.4M2 10h2M20 10h2M17.7 6.3l1.4-1.4"/><path d="M2 18c2.5-2 5-2 7.5 0s5 2 7.5 0 3.5-1.3 5 0"/>',
  coffee: '<path d="M4 9h13v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3v3M12 3v3"/>',
  heart: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  car: '<path d="M3 16v-4l2.2-5h13.6L21 12v4z"/><circle cx="7.5" cy="16.5" r="2"/><circle cx="16.5" cy="16.5" r="2"/><path d="M3 12h18"/>',
  plane: '<path d="M10.5 13.5L3 11l1.5-1.5 8 .5 5-5c1-1 2.5-1 3 0s0 2-1 3l-5 5 .5 8L13.5 22 11 14.5"/>',
  boat: '<path d="M3 15h18l-3 5H6z"/><path d="M12 3v12M12 4l6 8h-6"/>',
  bus: '<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16"/><circle cx="8" cy="19" r="1.5"/><circle cx="16" cy="19" r="1.5"/>',
  bike: '<circle cx="6" cy="16" r="4"/><circle cx="18" cy="16" r="4"/><path d="M6 16l4-8h5l3 8M10 8l3 8M9 6h3"/>',
  pin: '<path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  flip: '<path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5"/><path d="M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/>',
  up: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  star: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>'
};
const icon = n => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.heart}</svg>`;
const SQUIG = '<svg class="squiggle" viewBox="0 0 150 16" aria-hidden="true"><path d="M2 8H58M92 8H148"/><ellipse cx="75" cy="8" rx="11" ry="6.5"/></svg>';
const head = (title, intro, kicker) =>
  `<div class="sec-head" data-reveal>${kicker ? `<p class="label">${esc(kicker)}</p>` : ""}<h2 class="title">${esc(title)}</h2>${SQUIG}${intro ? `<p class="intro">${esc(intro)}</p>` : ""}</div>`;

/* ---------- Colors & basics ---------- */
const monoSvg = () => `<svg class="mono-svg" viewBox="0 0 100 120" aria-hidden="true">
  <ellipse cx="50" cy="60" rx="47" ry="57" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <ellipse cx="50" cy="60" rx="42" ry="52" fill="none" stroke="currentColor" stroke-width=".8"/>
  <text x="50" y="62" text-anchor="middle" dominant-baseline="central" fill="currentColor"
    font-family="Cormorant Garamond, Georgia, serif" font-weight="300" font-size="${mono.length > 1 ? 38 : 66}">${esc(mono)}</text></svg>`;
const colorVars = { primary: "--primary", primaryDark: "--primary-deep", accent: "--accent", background: "--bg", card: "--paper", tint: "--tint1", tint2: "--tint2", text: "--ink" };
for (const [k, v] of Object.entries(S.colors || {})) if (colorVars[k] && v) document.documentElement.style.setProperty(colorVars[k], v);

const C = S.couple || {};
const mono = C.monogram || "";
const both = `${C.one || ""} & ${C.two || ""}`;
document.title = S.siteTitle || both;
$("#navMono").innerHTML = monoSvg();
$("#footMono").innerHTML = monoSvg();
$("#footText").textContent = [both, S.dateText, S.location].filter(Boolean).join(" · ") + (S.footer ? ` — ${S.footer}` : "");

/* ---------- Hero ---------- */
const H = S.hero || {};
$("#heroMono").innerHTML = monoSvg();
$("#heroNames").innerHTML = `${esc(C.one)} <span class="amp">&amp;</span><br>${esc(C.two)}`;
$("#heroDate").textContent = S.dateText || "";
$("#heroLine").textContent = [H.kicker, S.location].filter(Boolean).join(" — ");
$("#heroScript").textContent = H.tagline || "";
if (H.photo) { $("#heroPhoto").hidden = false; $("#heroPhoto").style.backgroundImage = `url("${H.photo}")`; }

/* ---------- Welcome ---------- */
const shown = sec => sec && sec.show !== false;
const W = shown(S.welcome) && S.welcome;
if (W) {
  const photos = (W.photos || []).slice(0, 5);
  const n = photos.length;
  $("#welcome").innerHTML = `<div class="paper"><div class="welcome">
    <div data-reveal>
      ${W.kicker ? `<p class="label">${esc(W.kicker)}</p>` : ""}
      <h2 class="title">${esc(W.title)}</h2>${SQUIG}
      <div style="margin-top:22px">${(W.paragraphs || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      ${W.signature ? `<div class="sig">${esc(W.signature)}</div>` : ""}
    </div>
    ${n ? `<div class="polaroids" id="pols">${photos.map((p, i) => {
      const off = i - (n - 1) / 2;
      return `<figure class="pol" style="--x:${off * 58}%;--y:${(i % 2 ? -14 : 12)}px;--r:${off * 8 + (i % 2 ? 3 : -2)}deg;--r0:${(i % 2 ? 4 : -3)}deg;--d:${i * 120}ms;z-index:${i}">
        <div class="ph" ${p.src ? `style="background-image:url('${esc(p.src)}')"` : ""}>${p.src ? "" : "Your photo"}</div>
        <figcaption>${esc(p.caption)}</figcaption></figure>`;
    }).join("")}</div>` : ""}
  </div></div>`;
} else $("#welcome").remove();

/* ---------- Schedule ---------- */
const pad = n => String(n).padStart(2, "0");
const parseDay = d => { const [y, m, dd] = d.split("-").map(Number); return new Date(y, m - 1, dd); };
const fmtDay = d => parseDay(d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }).replace(", ", " · ");
const fmtTime = t => { const [h, m] = t.split(":").map(Number); return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? "AM" : "PM"}`; };
const events = S.schedule?.events || [];
if (events.length) {
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  $("#schedule").innerHTML = `<div class="paper">${head(S.schedule.title, S.schedule.intro)}
    <div class="cal-all" data-reveal><button class="btn" data-ics="all">${icon("calendar")} Add all to calendar</button></div>
    <div class="tl" id="tl"><div class="tl-line"><i></i></div>
    ${events.map((e, i) => `<article class="tl-item" data-reveal>
      <div class="tl-dot">${icon(e.icon)}</div>
      <div class="ev">
        ${e.date ? `<p class="label">${esc(fmtDay(e.date))}</p>` : ""}
        <h3>${esc(e.name)}</h3>
        ${e.description ? `<p class="ev-desc">${esc(e.description)}</p>` : ""}
        <dl>
          ${row("Time", e.time ? esc(e.time) : e.allDay ? "All day" : esc([e.start, e.end].filter(Boolean).map(fmtTime).join(" – ")))}
          ${row("Place", esc(e.venue))}
          ${e.address ? row("Address", `<a href="${mapUrl(e.address)}" target="_blank" rel="noopener">${esc(e.address)}</a>`) : ""}
          ${row("Attire", esc(e.attire))}
        </dl>
        ${e.note ? `<p class="note">${esc(e.note)}</p>` : ""}
        <div class="ev-actions">
          ${e.date ? `<button class="chip-btn" data-ics="${i}">${icon("calendar")} Add to calendar</button>` : ""}
          ${e.address ? `<a class="chip-btn" href="${mapUrl(e.address)}" target="_blank" rel="noopener">${icon("pin")} Map</a>` : ""}
        </div>
      </div></article>`).join("")}
    </div></div>`;
} else $("#schedule").remove();

/* Calendar file (.ics) */
const icsEsc = s => String(s || "").replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
const ymd = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
function downloadIcs(list, name) {
  const now = new Date();
  const stamp = `${now.getUTCFullYear()}${pad(now.getUTCMonth() + 1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Wedding Website//EN", "CALSCALE:GREGORIAN"];
  list.filter(e => e.date).forEach((e, i) => {
    const day = parseDay(e.date), next = new Date(day); next.setDate(day.getDate() + 1);
    L.push("BEGIN:VEVENT", `UID:${ymd(day)}-${i}-${Math.random().toString(36).slice(2)}@wedding`, `DTSTAMP:${stamp}`);
    if (e.allDay || !e.start) L.push(`DTSTART;VALUE=DATE:${ymd(day)}`, `DTEND;VALUE=DATE:${ymd(next)}`);
    else {
      L.push(`DTSTART:${ymd(day)}T${e.start.replace(":", "")}00`);
      if (e.end) L.push(`DTEND:${ymd(e.end <= e.start ? next : day)}T${e.end.replace(":", "")}00`);
    }
    L.push(`SUMMARY:${icsEsc(`${e.name} — ${both}`)}`, `LOCATION:${icsEsc([e.venue, e.address].filter(Boolean).join(", "))}`);
    if (e.note) L.push(`DESCRIPTION:${icsEsc(e.note)}`);
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\r\n")], { type: "text/calendar" }));
  a.download = name.replace(/[^\w-]+/g, "-").toLowerCase() + ".ics";
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-ics]");
  if (!b) return;
  const k = b.dataset.ics;
  if (k === "all") downloadIcs(events, S.siteTitle || "wedding-weekend");
  else downloadIcs([events[+k]], events[+k].name);
  burst(e.clientX, e.clientY, 8);
});

/* ---------- Hotels: hotel key tags ---------- */
const hotels = S.stay?.hotels || [];
if (hotels.length) {
  $("#stay").innerHTML = `<div class="paper">${head(S.stay.title, S.stay.intro)}
    ${S.stay.script ? `<p class="lead-script" style="text-align:center;margin:-18px 0 34px" data-reveal>${esc(S.stay.script)}</p>` : ""}
    ${hotels.filter(h => h.price).length > 1 ? `<div class="toolbar" data-reveal><button class="chip" id="sortBtn" aria-pressed="false">Sort by price ↑</button></div>` : ""}
    <div class="keytags" id="hotelGrid">${hotels.map((h, i) => {
      const p = Math.max(1, Math.min(3, +h.price || 0));
      return `<article class="keytag" data-reveal style="--d:${i * 90}ms;--tilt:${[-2.5, 2, -1.5, 2.5, -2][i % 5]}deg" data-i="${i}" data-price="${h.price ? p : 0}">
        <span class="keytag-ring" aria-hidden="true"></span>
        <p class="keytag-no">No. ${pad(i + 1)}</p>
        <h3>${h.link ? `<a class="keytag-link" href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.name)}</a>` : esc(h.name)}</h3>
        ${h.tag ? `<p class="keytag-pill">${icon("car")}${esc(h.tag)}</p>` : ""}
        ${h.address ? `<p class="keytag-addr">${esc(h.address)}</p>` : ""}
        ${h.price ? `<div class="price">${"$".repeat(p)}<i>${"$".repeat(3 - p)}</i></div>` : ""}
        ${h.code ? `<div class="keytag-code"><span class="label">${esc(h.codeLabel || "Code")}</span>
          <span class="code">${esc(h.code)}</span><button class="copy" type="button" data-code="${esc(h.code)}">Copy</button></div>` : ""}
        ${h.note ? `<p class="keytag-note">${esc(h.note)}</p>` : ""}
        <div class="keytag-actions">
          ${h.link ? `<span class="keytag-cta">Visit website ${icon("arrow")}</span>` : ""}
          ${h.address ? `<a class="keytag-map" href="${mapUrl(h.address)}" target="_blank" rel="noopener">${icon("pin")} Directions</a>` : ""}
        </div>
      </article>`;
    }).join("")}</div></div>`;
  const grid = $("#hotelGrid");
  grid.addEventListener("click", e => {
    const copy = e.target.closest(".copy");
    if (!copy) return;
    const done = () => { copy.textContent = "Copied ♥"; setTimeout(() => copy.textContent = "Copy", 1600); };
    navigator.clipboard?.writeText(copy.dataset.code).then(done, done) ?? done();
    burst(e.clientX, e.clientY, 8);
  });
  let sortMode = 0; // 0 original, 1 low→high, 2 high→low
  $("#sortBtn")?.addEventListener("click", ev => {
    sortMode = (sortMode + 1) % 3;
    ev.currentTarget.textContent = ["Sort by price ↑", "Price: low to high", "Price: high to low"][sortMode];
    ev.currentTarget.setAttribute("aria-pressed", sortMode ? "true" : "false");
    const cards = $$(".keytag", grid);
    const first = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
    cards.sort((a, b) => sortMode === 0 ? a.dataset.i - b.dataset.i : sortMode === 1 ? a.dataset.price - b.dataset.price : b.dataset.price - a.dataset.price)
      .forEach(c => grid.append(c));
    if (!reduce) cards.forEach(c => { // slide cards to their new spots
      const a = first.get(c), b = c.getBoundingClientRect();
      c.animate([{ translate: `${a.left - b.left}px ${a.top - b.top}px` }, { translate: "0 0" }], { duration: 550, easing: "cubic-bezier(.3,.8,.3,1)" });
    });
  });
} else $("#stay").remove();

/* ---------- Travel ---------- */
const T = S.travel;
if (T && ((T.gettingHere || []).length || (T.gettingAround || []).length)) {
  const tiles = list => `<div class="tiles">${list.map((t, i) => `<div class="tile" data-reveal style="--d:${i * 80}ms">
      <div class="bubble">${icon(t.icon)}</div><div><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></div></div>`).join("")}</div>`;
  $("#travel").innerHTML = `<div class="paper">${head(T.title, T.intro)}
    ${(T.gettingHere || []).length ? `<div class="sub">${esc(T.hereLabel || "Getting here")}</div>${tiles(T.gettingHere)}` : ""}
    ${T.hereNote ? `<p class="travel-note" data-reveal>${esc(T.hereNote)}</p>` : ""}
    ${(T.gettingAround || []).length || T.aroundNote ? `<div class="sub">${esc(T.aroundLabel || "Getting around")}</div>` : ""}
    ${(T.gettingAround || []).length ? tiles(T.gettingAround) : ""}
    ${T.aroundNote ? `<p class="travel-note" data-reveal>${esc(T.aroundNote)}</p>` : ""}
  </div>`;
} else $("#travel").remove();

/* ---------- Things to do ---------- */
const places = shown(S.todo) ? S.todo.places || [] : [];
if (places.length) {
  const catIcon = { coffee: "coffee", eat: "dinner", food: "dinner", drinks: "drinks", bar: "drinks", do: "sun", see: "star", shop: "heart" };
  const cats = [...new Set(places.map(p => p.category).filter(Boolean))];
  $("#todo").innerHTML = `<div class="paper">${head(S.todo.title, S.todo.intro)}
    ${cats.length > 1 ? `<div class="toolbar" data-reveal>${["All", ...cats].map((c, i) => `<button class="chip" data-cat="${esc(c)}" aria-pressed="${i === 0}">${esc(c)}</button>`).join("")}</div>` : ""}
    <div class="grid" id="todoGrid">${places.map((p, i) => `<article class="postcard" data-reveal style="--d:${Math.min(i, 8) * 70}ms" data-cat="${esc(p.category)}">
      <div class="stamp">${icon(p.icon || catIcon[(p.category || "").toLowerCase()] || "heart")}</div>
      <h3>${esc(p.name)}</h3>
      ${p.address ? `<p class="label"><a href="${mapUrl(p.address)}" target="_blank" rel="noopener">${esc(p.address)}</a></p>` : ""}
      ${p.note ? `<p>${esc(p.note)}</p>` : ""}
    </article>`).join("")}</div></div>`;
  $("#todo").addEventListener("click", e => {
    const chip = e.target.closest("[data-cat].chip");
    if (!chip) return;
    $$(".chip", $("#todo")).forEach(c => c.setAttribute("aria-pressed", c === chip));
    let n = 0;
    $$(".postcard", $("#todo")).forEach(card => {
      const show = chip.dataset.cat === "All" || card.dataset.cat === chip.dataset.cat;
      card.hidden = !show;
      card.classList.remove("pop");
      if (show) { card.style.setProperty("--d", `${n++ * 60}ms`); void card.offsetWidth; card.classList.add("pop"); }
    });
  });
} else $("#todo").remove();

/* ---------- Attire ---------- */
const looks = shown(S.attire) ? S.attire.looks || [] : [];
if (looks.length) {
  $("#attire").innerHTML = `<div class="paper">${head(S.attire.title, S.attire.intro)}
    <div class="looks">${looks.map((l, i) => `<div class="look" data-reveal style="--d:${i * 120}ms">
      <p class="label">${esc(l.event)}</p><h3>${esc(l.code)}</h3><p>${esc(l.text)}</p>
      ${(l.palette || []).length ? `<div class="swatches">${l.palette.map((c, j) => `<span style="background:${esc(c)};--i:${j}"></span>`).join("")}</div>` : ""}
    </div>`).join("")}</div></div>`;
} else $("#attire").remove();

/* ---------- FAQ ---------- */
const faqs = shown(S.faq) ? S.faq.items || [] : [];
if (faqs.length) {
  $("#faq").innerHTML = `<div class="paper">${head(S.faq.title, S.faq.intro)}
    <div>${faqs.map((f, i) => `<div class="faq-item" data-reveal style="--d:${Math.min(i, 6) * 60}ms">
      <button class="faq-q" aria-expanded="false" aria-controls="faq${i}">${esc(f.q)}<span class="pm"></span></button>
      <div class="faq-a" id="faq${i}"><div><p>${esc(f.a)}</p></div></div></div>`).join("")}</div></div>`;
  $("#faq").addEventListener("click", e => {
    const q = e.target.closest(".faq-q");
    if (!q) return;
    const open = q.parentElement.classList.toggle("open");
    q.setAttribute("aria-expanded", open);
  });
} else $("#faq").remove();

/* ---------- RSVP ---------- */
const R = shown(S.rsvp) && S.rsvp;
if (R) {
  $("#rsvp").innerHTML = `<div class="sec-head" data-reveal style="margin:0">
      <p class="label">RSVP</p><h2 class="title">${esc(R.title)}</h2>${SQUIG}
      ${R.deadline ? `<p class="deadline">${esc(R.text || "")} ${esc(R.deadline)}</p>` : '<div style="height:30px"></div>'}
      ${R.link ? `<a class="big-btn" id="rsvpBtn" href="${esc(R.link)}" target="_blank" rel="noopener">${esc(R.button || "RSVP")}</a>`
               : `<span class="big-btn" id="rsvpBtn" aria-disabled="true">Coming soon</span>`}
    </div>`;
  $("#rsvpBtn").addEventListener("click", e => burst(e.clientX, e.clientY, 18));
} else $("#rsvp").remove();

/* ---------- Keep backgrounds alternating and the scroll arrow pointing at the first section ---------- */
const secs = $$("main > .sec:not(.rsvp)");
secs.forEach((el, i) => { el.classList.remove("tone-blue", "tone-ivory"); el.classList.add(i % 2 ? "tone-ivory" : "tone-blue"); });
if (secs[0]) $(".scroll-cue").setAttribute("href", "#" + secs[0].id);

/* ---------- Nav + menu ---------- */
const NAV = [["welcome", "Welcome"], ["schedule", "Schedule"], ["stay", "Stay"], ["travel", "Travel"], ["todo", "To-Do"], ["attire", "Attire"], ["faq", "FAQ"], ["rsvp", "RSVP"]]
  .filter(([id]) => document.getElementById(id));
$("#navLinks").innerHTML = NAV.map(([id, t]) => `<li><a href="#${id}">${t}</a></li>`).join("");
$("#menu").innerHTML = NAV.map(([id, t], i) => `<a href="#${id}" style="--i:${i}">${t}</a>`).join("");
const setMenu = open => {
  document.body.classList.toggle("menu-open", open);
  $("#burger").setAttribute("aria-expanded", open);
};
$("#burger").addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
$("#menu").addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setMenu(false); });

$("#toTop").innerHTML = icon("up");
$("#toTop").addEventListener("click", () => scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" }));

/* ---------- Reveal on scroll ---------- */
const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (!en.isIntersecting) return;
  en.target.classList.add("in");
  io.unobserve(en.target);
}), { threshold: .15, rootMargin: "0px 0px -8% 0px" });
$$("[data-reveal], #pols").forEach(el => io.observe(el));

const spy = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) $$(".nav-links a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
}), { rootMargin: "-45% 0px -50% 0px" });
NAV.forEach(([id]) => spy.observe(document.getElementById(id)));

/* ---------- Scroll effects: nav, parallax, timeline ---------- */
const nav = $("#nav"), tl = $("#tl"), toTop = $("#toTop");
let ticking = false;
function onScroll() {
  ticking = false;
  const y = scrollY, vh = innerHeight;
  nav.classList.toggle("solid", y > vh * .6);
  toTop.classList.toggle("show", y > vh);
  if (tl) {
    const r = tl.getBoundingClientRect();
    const p = Math.max(0, Math.min(1, (vh * .6 - r.top) / r.height));
    tl.style.setProperty("--p", p);
    const reach = p * r.height;
    $$(".tl-item", tl).forEach(it => it.classList.toggle("passed", it.offsetTop + 26 <= reach));
  }
}
addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
addEventListener("resize", onScroll);
onScroll();

/* ---------- Countdown ---------- */
const target = new Date(S.date);
const cdEl = $("#countdown");
if (isNaN(target)) cdEl.remove();
else {
  cdEl.innerHTML = ["Days", "Hours", "Mins", "Secs"].map(u => `<div class="cd"><b>0</b><small>${u}</small></div>`).join("");
  const cells = $$("b", cdEl);
  const tick = () => {
    const ms = target - Date.now();
    if (ms <= 0) { cdEl.innerHTML = '<p class="married">Just married!</p>'; clearInterval(timer); return; }
    [Math.floor(ms / 864e5), Math.floor(ms / 36e5) % 24, Math.floor(ms / 6e4) % 60, Math.floor(ms / 1e3) % 60].forEach((v, i) => {
      const t = i ? pad(v) : String(v);
      if (cells[i].textContent !== t) {
        cells[i].textContent = t;
        cells[i].classList.remove("tick"); void cells[i].offsetWidth; cells[i].classList.add("tick");
      }
    });
  };
  const timer = setInterval(tick, 1000);
  tick();
}

/* ---------- Falling petals ---------- */
function petals() {
  const cv = $("#petals");
  if (reduce || !cv.getContext || !FX.leaves) return;
  const ctx = cv.getContext("2d");
  const cs = getComputedStyle(document.documentElement);
  const colors = [cs.getPropertyValue("--accent"), cs.getPropertyValue("--tint1"), cs.getPropertyValue("--primary")].map(c => c.trim());
  let w, h, running = true;
  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize(); addEventListener("resize", resize);
  const make = top => ({ x: Math.random() * w, y: top ? -20 - Math.random() * h * .3 : Math.random() * h,
    r: 5 + Math.random() * 7, vy: .35 + Math.random() * .7, ph: Math.random() * 6.28, rot: Math.random() * 6.28,
    vr: (Math.random() - .5) * .03, c: colors[Math.floor(Math.random() * colors.length)], a: .2 + Math.random() * .35 });
  const P = Array.from({ length: w < 600 ? 16 : 26 }, () => make(false));
  new IntersectionObserver(([en]) => { running = en.isIntersecting; if (running) requestAnimationFrame(draw); }).observe(cv);
  function draw() {
    if (!running) return;
    ctx.clearRect(0, 0, w, h);
    for (const p of P) {
      p.y += p.vy; p.ph += .015; p.x += Math.sin(p.ph) * .6; p.rot += p.vr;
      if (p.y > h + 20) Object.assign(p, make(true));
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, .55 + .45 * Math.sin(p.ph * 2));
      ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.moveTo(0, -p.r);
      ctx.bezierCurveTo(p.r, -p.r * .6, p.r * .7, p.r * .7, 0, p.r);
      ctx.bezierCurveTo(-p.r * .7, p.r * .7, -p.r, -p.r * .6, 0, -p.r);
      ctx.fill(); ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}

/* ---------- Heart burst ---------- */
function burst(x, y, n = 14) {
  if (reduce || !x || !FX.hearts) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "heart"; s.textContent = "♥";
    s.style.left = x + "px"; s.style.top = y + "px";
    if (i % 3 === 0) s.style.color = "var(--primary)";
    document.body.append(s);
    const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 80;
    s.animate([
      { transform: "translate(-50%,-50%) scale(.3)", opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d - 40}px)) scale(${.7 + Math.random() * .8}) rotate(${Math.random() * 70 - 35}deg)`, opacity: 0 }
    ], { duration: 900 + Math.random() * 600, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
  }
}

/* ---------- Envelope intro ---------- */
const intro = $("#intro"), env = $("#env"), card = $("#envCard");
const pw = (S.password || "").trim();
$("#seal").innerHTML = monoSvg();
$("#cardMono").innerHTML = monoSvg();
$("#cardWho").textContent = both;
$("#cardWhen").textContent = [S.dateText, S.location].filter(Boolean).join(" · ");
if (pw) card.classList.add("pw");

function enter() {
  store.set("opened", "1");
  intro.classList.add("leaving");
  document.body.classList.remove("locked");
  setTimeout(() => {
    intro.classList.add("gone");
    document.body.classList.add("ready");
    petals();
  }, 450);
  setTimeout(() => intro.remove(), 1500);
}
if (S.intro === false || store.get("opened")) {
  intro.remove();
  document.body.classList.remove("locked");
  document.body.classList.add("ready");
  petals();
} else {
  $("#seal").addEventListener("click", e => {
    const r = e.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 16);
    env.classList.add("open");
    setTimeout(() => {
      env.classList.add("out");
      if (pw) setTimeout(() => $("#pwInput").focus(), 700);
      else setTimeout(enter, 1500);
    }, reduce ? 0 : 900);
  });
  $("#pwForm").addEventListener("submit", e => {
    e.preventDefault();
    if ($("#pwInput").value.trim().toLowerCase() === pw.toLowerCase()) enter();
    else {
      $("#pwErr").textContent = "Hmm, try again";
      card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    }
  });
}
})();
</script>
