<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reserve Your Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<script src="content.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.stay-page{min-height:100svh;padding:clamp(24px,6vw,70px) 16px}
.stay-page .paper{max-width:680px;text-align:center}
.home{display:block;width:clamp(64px,13vw,86px);margin:0 auto 22px;color:var(--primary)}
.stay-top{font:500 clamp(1.9rem,6vw,2.9rem)/1.08 var(--serif);text-transform:uppercase;letter-spacing:.01em;color:var(--primary);margin:0}
.stay-venue{font:400 clamp(1.15rem,3.4vw,1.4rem)/1.35 var(--body);color:var(--primary);margin:10px 0 0}
.stay-page .lead-script{margin:18px 0 4px}
.stay-intro{color:var(--muted);max-width:480px;margin:18px auto 0}
.fade{opacity:0;transform:translateY(14px);animation:rise .9s var(--d,0s) cubic-bezier(.2,.7,.2,1) forwards}

form.rsvp-form{text-align:left;margin-top:38px;display:grid;gap:24px}
.field{display:grid;gap:8px;border:0;margin:0;padding:0;min-width:0}
.field > .label,.field legend{color:var(--primary);padding:0}
.field legend{margin-bottom:8px}
.req{color:var(--accent)}
.field input[type=text],.field input[type=email],.field input[type=tel],.field textarea,.field select{
  width:100%;padding:.55em .1em;border:0;border-bottom:1px solid color-mix(in srgb,var(--primary) 40%,transparent);background:transparent;
  font:400 1.1rem/1.4 var(--body);color:var(--ink);border-radius:0;transition:border-color .25s}
.field textarea{resize:vertical;min-height:80px;border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);padding:.6em .7em}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--primary)}
.two{display:grid;gap:24px}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.choices{display:grid;gap:10px}
.choice{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);background:var(--paper);cursor:pointer;transition:border-color .25s,background .25s}
.choice:hover{border-color:var(--primary)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice .box{width:18px;height:18px;flex:none;border:1px solid var(--primary);display:grid;place-items:center;transition:background .2s}
.choice input[type=radio] + .box{border-radius:50%}
.choice .box::after{content:"";width:8px;height:8px;background:var(--paper);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.choice input[type=radio] + .box::after{border-radius:50%}
.choice input:checked + .box{background:var(--primary)}
.choice input:checked + .box::after{transform:scale(1)}
.choice input:focus-visible + .box{outline:2px solid var(--accent);outline-offset:2px}
.choice:has(input:checked){border-color:var(--primary);background:color-mix(in srgb,var(--tint1) 45%,var(--paper))}
.nights[hidden]{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.submit-row{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:6px}
.submit-row .btn{min-width:220px;padding:1.15em 2em}
.form-msg{min-height:1.2em;margin:0;font-size:.95rem;text-align:center;color:#a2423a}
.btn[disabled]{opacity:.6;cursor:wait}

.thanks{display:none;margin-top:30px}
.done .thanks{display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.done form.rsvp-form{display:none}
.thanks h2{font:500 clamp(1.8rem,5vw,2.4rem)/1.1 var(--serif);text-transform:uppercase;color:var(--primary);margin:0}
.thanks p{color:var(--muted);margin:14px 0 0}

.gate{display:none;margin-top:30px}
.gated .gate{display:block}
.gated .stay-body{display:none}
.gate form{display:flex;flex-direction:column;align-items:center;gap:12px}
.gate input{width:min(260px,100%);padding:.7em .9em;border:1px solid var(--line);background:var(--bg);font:400 1rem var(--body);text-align:center;color:var(--ink)}
.gate .shake{animation:shake .45s}
.back-home{display:inline-block;margin-top:34px;font:500 .68rem/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--primary);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px}
</style>
</head>
<body>
<main class="stay-page tone-blue">
  <div class="paper" id="card">
    <a class="home fade" href="./" id="homeMono" aria-label="Wedding website home"></a>
    <h1 class="stay-top fade" style="--d:.15s" id="stayTitle"></h1>
    <p class="stay-venue fade" style="--d:.3s" id="stayVenue"></p>
    <p class="lead-script fade" style="--d:.45s" id="stayScript"></p>

    <div class="gate">
      <p class="stay-intro">Please enter the password from your card.</p>
      <form id="gateForm" autocomplete="off">
        <input id="gateInput" type="password" placeholder="Password" aria-label="Password">
        <button class="btn" type="submit">Continue</button>
        <p class="form-msg" id="gateMsg"></p>
      </form>
    </div>

    <div class="stay-body">
      <p class="stay-intro fade" style="--d:.6s" id="stayIntro"></p>

      <form class="rsvp-form fade" style="--d:.75s" id="rsvpForm" novalidate>
        <div class="two">
          <label class="field"><span class="label">Full name(s) <span class="req">*</span></span>
            <input type="text" name="name" autocomplete="name" required></label>
          <label class="field"><span class="label">Email <span class="req">*</span></span>
            <input type="email" name="email" autocomplete="email" required></label>
        </div>
        <label class="field"><span class="label">Phone</span>
          <input type="tel" name="phone" autocomplete="tel"></label>

        <fieldset class="field">
          <legend class="label">Will you be staying with us? <span class="req">*</span></legend>
          <div class="choices">
            <label class="choice"><input type="radio" name="staying" value="Yes" required><span class="box"></span><span id="yesText"></span></label>
            <label class="choice"><input type="radio" name="staying" value="No"><span class="box"></span><span id="noText"></span></label>
          </div>
        </fieldset>

        <fieldset class="field nights" id="nightsField" hidden>
          <legend class="label">Which nights?</legend>
          <div class="choices" id="nightChoices"></div>
        </fieldset>

        <label class="field" id="guestsField" hidden><span class="label">Guests in the room</span>
          <select name="guests"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>

        <label class="field"><span class="label">Anything we should know?</span>
          <textarea name="notes" rows="3" placeholder="Arrival time, accessibility needs, questions…"></textarea></label>

        <label class="hp" aria-hidden="true">Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label>

        <div class="submit-row">
          <button class="btn" type="submit" id="submitBtn">Confirm my reservation</button>
          <p class="form-msg" id="formMsg" role="alert"></p>
        </div>
      </form>

      <div class="thanks" id="thanks" role="status">
        <h2 id="thanksTitle"></h2>
        <p class="lead-script" id="thanksScript"></p>
        <p id="thanksText"></p>
      </div>

      <a class="back-home" href="./">Visit the wedding website</a>
    </div>
  </div>
</main>

<script>
(() => {
const S = window.SITE || {};
const P = S.stayPage || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };

const colorVars = { primary: "--primary", primaryDark: "--primary-deep", accent: "--accent", background: "--bg", card: "--paper", tint: "--tint1", tint2: "--tint2", text: "--ink" };
for (const [k, v] of Object.entries(S.colors || {})) if (colorVars[k] && v) document.documentElement.style.setProperty(colorVars[k], v);

const C = S.couple || {};
const mono = C.monogram || "";
$("#homeMono").innerHTML = `<svg class="mono-svg" viewBox="0 0 100 120" aria-hidden="true">
  <ellipse cx="50" cy="60" rx="47" ry="57" fill="none" stroke="currentColor" stroke-width="1.6"/>
  <ellipse cx="50" cy="60" rx="42" ry="52" fill="none" stroke="currentColor" stroke-width=".8"/>
  <text x="50" y="62" text-anchor="middle" dominant-baseline="central" fill="currentColor"
    font-family="Cormorant Garamond, Georgia, serif" font-weight="300" font-size="${mono.length > 1 ? 38 : 66}">${esc(mono)}</text></svg>`;

document.title = P.pageTitle || "Reserve Your Room";
$("#stayTitle").textContent = P.title || "";
$("#stayVenue").textContent = P.venue || "";
$("#stayScript").textContent = P.script || "";
$("#stayIntro").textContent = [P.intro, P.deadline ? `Please confirm by ${P.deadline}.` : ""].filter(Boolean).join(" ");
$("#yesText").textContent = P.yesText || "Yes, please hold my room";
$("#noText").textContent = P.noText || "No, please release it";
$("#nightChoices").innerHTML = (P.nights || []).map(n =>
  `<label class="choice"><input type="checkbox" name="nights" value="${esc(n)}" checked><span class="box"></span><span>${esc(n)}</span></label>`).join("");
$("#thanksTitle").textContent = P.thanksTitle || "Thank you!";
$("#thanksScript").textContent = P.thanksScript || "";
$("#thanksText").textContent = P.thanksText || "";

/* Password gate (optional) */
const card = $("#card");
const pw = (P.password || "").trim();
if (pw && store.get("stayOpen") !== "1") card.classList.add("gated");
$("#gateForm").addEventListener("submit", e => {
  e.preventDefault();
  if ($("#gateInput").value.trim().toLowerCase() === pw.toLowerCase()) {
    store.set("stayOpen", "1");
    card.classList.remove("gated");
  } else {
    $("#gateMsg").textContent = "Hmm, that's not it. Try again?";
    const f = $("#gateForm"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
  }
});

/* Show nights + guests only when they're staying */
const form = $("#rsvpForm");
const f = n => form.elements.namedItem(n);
form.addEventListener("change", () => {
  const yes = f("staying").value === "Yes";
  $("#nightsField").hidden = !yes || !(P.nights || []).length;
  $("#guestsField").hidden = !yes;
});

/* Submit to the Google Sheet */
form.addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("#formMsg"), btn = $("#submitBtn");
  msg.textContent = "";
  const name = f("name").value.trim(), email = f("email").value.trim();
  if (!name || !email || !f("staying").value) { msg.textContent = "Please fill in your name, email and whether you're staying."; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = "That email address doesn't look quite right."; return; }
  if (!P.formUrl) { msg.textContent = "This form isn't connected yet — please check back soon."; return; }

  const yes = f("staying").value === "Yes";
  const data = new URLSearchParams({
    name, email,
    phone: f("phone").value.trim(),
    staying: f("staying").value,
    nights: yes ? [...form.querySelectorAll('input[name="nights"]:checked')].map(i => i.value).join(", ") : "",
    guests: yes ? f("guests").value : "",
    notes: f("notes").value.trim(),
    website: f("website").value
  });
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    // Google Apps Script doesn't send CORS headers, so the reply can't be read; a network error still throws.
    await fetch(P.formUrl, { method: "POST", mode: "no-cors", body: data });
    card.classList.add("done");
    card.scrollIntoView({ behavior: "smooth", block: "start" });
  } catch {
    msg.textContent = "Something went wrong sending your reply. Please try again, or contact us directly.";
    btn.disabled = false; btn.textContent = "Confirm my reservation";
  }
});
})();
</script>
</body>
</html>
